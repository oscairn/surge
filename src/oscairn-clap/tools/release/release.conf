# Oscairn plugin release configuration.
#
# The ONE place holding this repo's release facts. When copying this release setup to
# another Oscairn plugin fork, edit only this file; build.sh, check_deps.py,
# licenses.sh, manifest.py and selfcheck.py stay generic.
#
# KEY=VALUE, one per line, comments on their own line: sourced by POSIX sh and
# parsed by the Python scripts the same way.

NAME=oscairn-analog
# File stem of each release asset: <NAME>-<platform>.clap

PACKAGE_ID=org.oscairn.analog
PACKAGE_NAME="Oscairn Analog"
PACKAGE_SUMMARY="Analog synthesizer based on Surge XT, with Oscairn sound contexts, snapshots, voice budget and instance sharing; factory patches from org.oscairn.analog-factory."
# SPDX expression, as published in the packages repo (quoted: sourced by sh, and it has spaces):
LICENSE="GPL-3.0-or-later AND MIT AND Apache-2.0 AND (BSD-3-Clause OR GPL-2.0-only) AND 0BSD AND Zlib AND blessing AND ISC AND LicenseRef-FFTPACK AND LicenseRef-Ooura-FFT"
# Every plugin in the bundle as "descriptor-file=kind" pairs (kind: synth | effect |
# note-effect); each plugin's own version is read from its clap_plugin_descriptor_t:
PLUGINS="src/oscairn-clap/OscairnAnalog.cpp=synth"
# The package version: this repo publishes release == plugin version (see the packages
# repo's org.oscairn.analog records), so it is read from the plugin descriptor, not
# duplicated. "cmake:<file>" reads a project(<name> VERSION X.Y.Z) line instead.
PACKAGE_VERSION_FROM=descriptor:src/oscairn-clap/OscairnAnalog.cpp
SOURCE_URL=https://github.com/oscairn/surge
# Releases are tagged oscairn-vX.Y.Z (upstream v* tags exist in forks):
TAG_PREFIX=oscairn-
# CMake tree to configure (Surge's whole tree; the Oscairn targets are gated by
# SURGE_BUILD_OSCAIRN, see .github/workflows/oscairn.yml), and the .clap it produces:
CMAKE_SOURCE_DIR=.
CLAP_FILE=src/oscairn-clap/oscairn-analog.clap
CLAP_VERSION_FILE=libs/clap-juce-extensions/clap-libs/clap/include/clap/version.h
OSCAIRN_CLAP_UPSTREAM=src/oscairn-clap/third_party/oscairn-clap/upstream.json
# Extra cmake configure args, the same ones oscairn.yml uses (space-separated,
# unquoted in build.sh); BUILD_TARGETS are built instead of the whole product:
CMAKE_ARGS="-G Ninja -DSURGE_SKIP_JUCE_FOR_RACK=ON -DSURGE_SKIP_LUA=ON -DSURGE_BUILD_TESTRUNNER=OFF -DSURGE_BUILD_OSCAIRN=ON"
BUILD_TARGETS="oscairn-analog oscairn-analog-tests oscairn-analog-privacy-host"
# Asset dependencies as "id@version" pairs (from the published record):
ASSET_DEPS=org.oscairn.analog-factory@1.0.0
# Licence/notice files the binary needs, as "path=licenses-name" pairs -> licenses/<name>:
LICENSE_FILES="LICENSE=surge-LICENSE AUTHORS=surge-AUTHORS src/oscairn-clap/third_party/oscairn-clap/LICENSE=oscairn-clap-LICENSE libs/clap-juce-extensions/clap-libs/clap/LICENSE=clap-LICENSE libs/airwindows/LICENSE=airwindows-LICENSE libs/binn/LICENSE=binn-LICENSE libs/fmt/LICENSE=fmt-LICENSE libs/oddsound-mts/MTS-ESP/LICENSE=MTS-ESP-LICENSE libs/r8brain-free-src/LICENSE=r8brain-free-src-LICENSE libs/simde/COPYING=simde-COPYING libs/zstd/LICENSE=zstd-LICENSE libs/zstd/COPYING=zstd-COPYING libs/tuning-library/LICENSE.md=tuning-library-LICENSE.md libs/sst/sst-basic-blocks/LICENSE.md=sst-basic-blocks-LICENSE.md libs/sst/sst-cpputils/LICENSE.md=sst-cpputils-LICENSE.md libs/sst/sst-effects/LICENSE.md=sst-effects-LICENSE.md libs/sst/sst-filters/LICENSE.md=sst-filters-LICENSE.md libs/sst/sst-plugininfra/LICENSE.md=sst-plugininfra-LICENSE.md libs/sst/sst-plugininfra/LICENSE_MIT.md=sst-plugininfra-LICENSE_MIT.md libs/sst/sst-waveshapers/LICENSE.md=sst-waveshapers-LICENSE.md src/oscairn-clap/licenses/CMakeRC-LICENSE=CMakeRC-LICENSE src/oscairn-clap/licenses/chowdsp-SmoothedValue-LICENSE=chowdsp-SmoothedValue-LICENSE src/oscairn-clap/licenses/chowdsp-omega-LICENSE=chowdsp-omega-LICENSE src/oscairn-clap/licenses/eurorack-LICENSE=eurorack-LICENSE src/oscairn-clap/licenses/pffft-LICENSE=pffft-LICENSE src/oscairn-clap/licenses/r8brain-ooura-fft-LICENSE=r8brain-ooura-fft-LICENSE src/oscairn-clap/licenses/sqlite-LICENSE=sqlite-LICENSE src/oscairn-clap/licenses/strnatcmp-LICENSE=strnatcmp-LICENSE src/oscairn-clap/licenses/tinyxml-LICENSE=tinyxml-LICENSE"
